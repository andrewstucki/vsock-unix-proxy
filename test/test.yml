kernel:
  image: linuxkit/kernel:6.6.13
  cmdline: "console=tty0 vsock_port=8080"

init:
  - linuxkit/init:b5506cc74a6812dc40982cacfd2f4328f8a4b12a-arm64
  - linuxkit/runc:3c079dfa25a05653db203c2abfb329c4e08ba6f9-arm64
  - linuxkit/containerd:ba19f64efd3331a8fd0a33e00eabd14f6ee1780e-arm64

onboot:
  - name: format
    image: linuxkit/format:4f779c0b0d0ba145b7f03211b5cbf59fbbe12e54-arm64
    command: ["/usr/bin/format", "-force", "-type", "xfs", "-label", "DATA", "-verbose", "/dev/vda"]
  - name: mount
    image: linuxkit/mount:bd1c3bb45e48e68e47a9456d1669f7119f855184-arm64
    command: ["/usr/bin/mountie", "/var/lib"]

files: []

services:
  - name: socat
    image: alpine/socat:1.8.0.3
    binds:
      - /var/lib:/var/lib:rw
    command:
      [
        "/bin/sh",
        "-c",
        "socat UNIX-LISTEN:/var/lib/socket.sock,fork SYSTEM:'echo test'"
      ]
    capabilities:
      - CAP_NET_BIND_SERVICE
  - name: proxy
    image: vsock-unix-proxy:latest
    net: host
    binds:
      - /var/lib:/var/lib:rw
    command:
      [
        "/vsock-unix-proxy",
        "8080",
        "/var/lib/socket.sock"
      ]
    capabilities:
      - CAP_NET_BIND_SERVICE

trust:
  org:
    - linuxkit